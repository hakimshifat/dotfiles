# Ported from ~/.config/niri/noctalia/keybinds.kdl; Niri remains unchanged.
[general]
mod_key = "Alt"
autostart = ["noctalia"]
xwayland = true
xwayland_native_resolution = false
xwayland_xsettings = true
show_cheatsheet = false

[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"
QT_QPA_PLATFORM = "wayland"
QT_QPA_PLATFORMTHEME = "gtk3"
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"

[layout]
mode = "scrolling"
gap = 5
extent_presets = [0.33333, 0.5, 0.66667]

[layout.scrolling]
center_focused = "never"
center_underfull_strip = false
default_extent_fraction = 0.5

[input.touchpad]
tap = true
natural_scroll = true

[input.focus]
follows_mouse = true

[input.cursor]
theme = "Bibata-Modern-Ice"
size = 24

[workspaces]
back_and_forth = true

[output.eDP-1]
workspaces = "dynamic"
min_workspaces = 9
scale = 1.0

[keybinds]
"Mod+Shift+Escape" = { action = "cheatsheet-toggle", repeat = false }
"Mod+Return" = { action = "spawn konsole", repeat = false }
"Mod+Space" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Super+B" = { action = "spawn brave-origin", repeat = false }
"Alt+B" = { action = "spawn brave-origin", repeat = false }
"Super+L" = { action = "spawn noctalia msg session lock", repeat = false }
"Alt+w" = { action = "spawn noctalia msg wallpaper-random", repeat = false }
"Alt+n" = { action = "spawn noctalia msg panel-toggle noctalia/notes:panel", repeat = false }
"Super+Escape" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Super+E" = { action = "spawn nautilus --new-window", repeat = false }
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"Alt+m" = { action = "spawn noctalia msg mic-mute", repeat = false }
"Super+m" = { action = "spawn noctalia msg volume-mute", repeat = false }
"Super+v" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Left" = { action = "window-focus-left" }
"Mod+H" = { action = "window-focus-left" }
"Mod+Right" = { action = "window-focus-right" }
"Mod+L" = { action = "window-focus-right" }
"Mod+Up" = { action = "window-focus-up" }
"Mod+K" = { action = "window-focus-up" }
"Mod+Down" = { action = "window-focus-down" }
"Mod+J" = { action = "window-focus-down" }
"Mod+Shift+Left" = { action = "column-move-left" }
"Mod+Shift+Right" = { action = "column-move-right" }
"Mod+Shift+Up" = { action = "window-move-up" }
"Mod+Shift+H" = { action = "column-move-left" }
"Mod+Shift+J" = { action = "window-move-down" }
"Mod+Shift+K" = { action = "window-move-up" }
"Mod+Shift+L" = { action = "column-move-right" }
"Alt+Ctrl+Left" = { action = "window-modify-primary-extent -0.1" }
"Alt+Ctrl+Right" = { action = "window-modify-primary-extent 0.1" }
"Alt+Ctrl+Down" = { action = "window-modify-secondary-extent 0.1" }
"Alt+Ctrl+Up" = { action = "window-modify-secondary-extent -0.1" }
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+WheelRight" = { action = "window-focus-right" }
"Mod+WheelLeft" = { action = "window-focus-left" }
"Mod+Ctrl+WheelRight" = { action = "column-move-right" }
"Mod+Ctrl+WheelLeft" = { action = "column-move-left" }
"Mod+Shift+WheelDown" = { action = "window-focus-right" }
"Mod+Shift+WheelUp" = { action = "window-focus-left" }
"Mod+Ctrl+Shift+WheelDown" = { action = "column-move-right" }
"Mod+Ctrl+Shift+WheelUp" = { action = "column-move-left" }
"Mod+1" = { action = "workspace-switch 1" }
"Mod+2" = { action = "workspace-switch 2" }
"Mod+3" = { action = "workspace-switch 3" }
"Mod+4" = { action = "workspace-switch 4" }
"Mod+5" = { action = "workspace-switch 5" }
"Mod+6" = { action = "workspace-switch 6" }
"Mod+7" = { action = "workspace-switch 7" }
"Mod+8" = { action = "workspace-switch 8" }
"Mod+9" = { action = "workspace-switch 9" }
"Mod+Ctrl+1" = { action = "column-move-to-workspace 1" }
"Mod+Ctrl+2" = { action = "column-move-to-workspace 2" }
"Mod+Ctrl+3" = { action = "column-move-to-workspace 3" }
"Mod+Ctrl+4" = { action = "column-move-to-workspace 4" }
"Mod+Ctrl+5" = { action = "column-move-to-workspace 5" }
"Mod+Ctrl+6" = { action = "column-move-to-workspace 6" }
"Mod+Ctrl+7" = { action = "column-move-to-workspace 7" }
"Mod+Ctrl+8" = { action = "column-move-to-workspace 8" }
"Mod+Ctrl+9" = { action = "column-move-to-workspace 9" }
"Mod+Tab" = { action = "workspace-focus-last" }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+C" = { action = "column-center" }
"Mod+Ctrl+C" = { action = "column-center" }
"Mod+Minus" = { action = "window-modify-primary-extent -0.1" }
"Mod+Equal" = { action = "window-modify-primary-extent 0.1" }
"Mod+Shift+Minus" = { action = "window-modify-secondary-extent -0.1" }
"Mod+Shift+Equal" = { action = "window-modify-secondary-extent 0.1" }
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Shift+W" = { action = "column-toggle-tabbed", repeat = false }
"Print" = { action = "spawn noctalia msg screenshot-annotate --copy-to-clipboard --close-on-copy", repeat = false }
"Shift+Print" = { action = "spawn noctalia msg screenshot-annotate", repeat = false }
"Super+Space" = { action = "spawn noctalia msg panel-toggle aabidk20/yt-music:panel", repeat = false }
"Ctrl+Alt+Delete" = { action = "session-quit", repeat = false }
"Mod+Shift+P" = { action = "dpms-off" }
"Super+Tab" = { action = "overview-toggle", repeat = false }
"Mod+Shift+y" = "window-move-to-scratchpad"
"Mod+y" = "scratchpad-toggle"
"Mod+Ctrl+y" = "window-restore-from-scratchpad"

[[window_rule]]
match.app_id = "jadx-gui-JadxGUI"
default_floating = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
