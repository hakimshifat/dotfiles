<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep Latin families first; use a modern Bengali family before generic fallback. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Hind Siliguri</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif Bengali</family></prefer>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>bn</string></test>
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Hind Siliguri</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>bn</string></test>
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif Bengali</string></edit>
  </match>
</fontconfig>
